$engine: 3
$onesync: on

name: Kiwi ESX
version: "1.0"
author: kiwidegen
description: >
  Modern ESX base with the full ox ecosystem.
  Includes ox_lib, ox_inventory, ox_target, ox_fuel, ox_doorlock,
  illenium-appearance, bob74_ipl, pma-voice, Renewed-Weathersync and screencapture.
  Bring your own multichar - any resource that fires esx:onPlayerJoined will work.

tasks:

  # ============================
  # CFX DEFAULT RESOURCES
  # ============================
  - action: download_github
    src: https://github.com/citizenfx/cfx-server-data
    ref: master
    subpath: resources
    dest: ./resources/[cfx-default]
  - action: remove_path
    path: ./resources/[cfx-default]/[gameplay]/chat

  # ============================
  # KIWI ESX BASE
  # ============================
  - action: download_github
    src: https://github.com/kiwidegen/kiwi-esx
    ref: main
    dest: ./tmp/kiwi-esx

  - action: move_path
    src: ./tmp/kiwi-esx/[base]
    dest: ./resources/[base]

  - action: move_path
    src: ./tmp/kiwi-esx/[standalone]
    dest: ./resources/[standalone]

  - action: move_path
    src: ./tmp/kiwi-esx/[scripts]
    dest: ./resources/[scripts]

  # ============================
  # DATABASE
  # ============================
  - action: connect_database

  - action: query_database
    file: ./resources/[base]/es_extended/es_extended.sql

  # ============================
  # OX RESOURCES
  # ============================
  - action: download_file
    url: https://github.com/CommunityOx/oxmysql/releases/download/v2.12.3/oxmysql.zip
    path: ./tmp/oxmysql.zip
  - action: unzip
    src: ./tmp/oxmysql.zip
    dest: ./resources/[ox]/

  - action: download_file
    url: https://github.com/CommunityOx/ox_lib/releases/download/v3.32.3/ox_lib.zip
    path: ./tmp/ox_lib.zip
  - action: unzip
    src: ./tmp/ox_lib.zip
    dest: ./resources/[ox]/

  - action: download_file
    url: https://github.com/CommunityOx/ox_inventory/releases/download/v2.45.0/ox_inventory.zip
    path: ./tmp/ox_inventory.zip
  - action: unzip
    src: ./tmp/ox_inventory.zip
    dest: ./resources/[ox]/

  - action: download_file
    url: https://github.com/CommunityOx/ox_target/releases/download/v1.18.0/ox_target.zip
    path: ./tmp/ox_target.zip
  - action: unzip
    src: ./tmp/ox_target.zip
    dest: ./resources/[ox]/

  - action: download_file
    url: https://github.com/CommunityOx/ox_fuel/releases/download/v1.5.2/ox_fuel.zip
    path: ./tmp/ox_fuel.zip
  - action: unzip
    src: ./tmp/ox_fuel.zip
    dest: ./resources/[ox]/

  - action: download_file
    url: https://github.com/CommunityOx/ox_doorlock/releases/download/v1.22.0/ox_doorlock.zip
    path: ./tmp/ox_doorlock.zip
  - action: unzip
    src: ./tmp/ox_doorlock.zip
    dest: ./resources/[ox]/

  # ============================
  # STANDALONE / MISC
  # ============================
  - action: download_github
    src: https://github.com/Bob74/bob74_ipl
    ref: master
    dest: ./resources/[standalone]/[misc]/bob74_ipl

  - action: download_github
    src: https://github.com/AvarianKnight/pma-voice
    ref: main
    dest: ./resources/[standalone]/[misc]/pma-voice

  - action: download_file
    url: https://github.com/iLLeniumStudios/illenium-appearance/releases/download/v5.7.0/illenium-appearance.zip
    path: ./tmp/illenium-appearance.zip
  - action: unzip
    src: ./tmp/illenium-appearance.zip
    dest: ./resources/[standalone]/[misc]/

  - action: download_file
    url: https://github.com/Renewed-Scripts/Renewed-Weathersync/releases/download/v1.1.8/Renewed-Weathersync.zip
    path: ./tmp/Renewed-Weathersync.zip
  - action: unzip
    src: ./tmp/Renewed-Weathersync.zip
    dest: ./resources/[standalone]/[misc]/

  - action: download_file
    url: https://github.com/itschip/screencapture/releases/download/v0.11.0/screencapture.zip
    path: ./tmp/screencapture.zip
  - action: unzip
    src: ./tmp/screencapture.zip
    dest: ./resources/[standalone]/[misc]/

  # ============================
  # SERVER.CFG
  # ============================
  - action: write_file
    file: ./server.cfg
    contents: |
      #   ██╗  ██╗██╗██╗    ██╗██╗    ███████╗███████╗██╗  ██╗
      #   ██║ ██╔╝██║██║    ██║██║    ██╔════╝██╔════╝╚██╗██╔╝
      #   █████╔╝ ██║██║ █╗ ██║██║    █████╗  ███████╗ ╚███╔╝
      #   ██╔═██╗ ██║██║███╗██║██║    ██╔══╝  ╚════██║ ██╔██╗
      #   ██║  ██╗██║╚███╔███╔╝██║    ███████╗███████║██╔╝ ██╗
      #   ╚═╝  ╚═╝╚═╝ ╚══╝╚══╝ ╚═╝   ╚══════╝╚══════╝╚═╝  ╚═╝

      exec cfg/private.cfg
      exec cfg/convars.cfg
      exec cfg/permissions.cfg
      exec cfg/resources.cfg

  - action: write_file
    file: ./cfg/private.cfg
    contents: |
      #   ██╗  ██╗██╗██╗    ██╗██╗    ███████╗███████╗██╗  ██╗
      #   ██║ ██╔╝██║██║    ██║██║    ██╔════╝██╔════╝╚██╗██╔╝
      #   █████╔╝ ██║██║ █╗ ██║██║    █████╗  ███████╗ ╚███╔╝
      #   ██╔═██╗ ██║██║███╗██║██║    ██╔══╝  ╚════██║ ██╔██╗
      #   ██║  ██╗██║╚███╔███╔╝██║    ███████╗███████║██╔╝ ██╗
      #   ╚═╝  ╚═╝╚═╝ ╚══╝╚══╝ ╚═╝   ╚══════╝╚══════╝╚═╝  ╚═╝

      # --- License Key ---
      sv_licenseKey "{{svLicenseKey}}"

      # --- Database Connection ---
      set mysql_connection_string "{{dbConnectionString}}"

  - action: write_file
    file: ./cfg/convars.cfg
    contents: |
      #   ██╗  ██╗██╗██╗    ██╗██╗    ███████╗███████╗██╗  ██╗
      #   ██║ ██╔╝██║██║    ██║██║    ██╔════╝██╔════╝╚██╗██╔╝
      #   █████╔╝ ██║██║ █╗ ██║██║    █████╗  ███████╗ ╚███╔╝
      #   ██╔═██╗ ██║██║███╗██║██║    ██╔══╝  ╚════██║ ██╔██╗
      #   ██║  ██╗██║╚███╔███╔╝██║    ███████╗███████║██╔╝ ██╗
      #   ╚═╝  ╚═╝╚═╝ ╚══╝╚══╝ ╚═╝   ╚══════╝╚══════╝╚═╝  ╚═╝

      # --- Endpoints ---
      endpoint_add_tcp "0.0.0.0:30120"
      endpoint_add_udp "0.0.0.0:30120"

      # --- Basic Server Info ---
      sets sv_projectName "Kiwi ESX"
      sets sv_projectDesc ""
      sets sv_hostname "Kiwi ESX"
      sv_maxclients 64
      sets locale "root-US"
      sv_enforceGameBuild 3258

      # --- OneSync ---
      set onesync on

      # --- Tags ---
      sets tags "esx, roleplay, ox"

      # --- Framework & Integration ---
      setr bl:framework "esx"
      setr bl:inventory "ox"
      setr bl:context "ox"
      setr bl:target "ox"
      setr bl:progressbar "ox"
      setr bl:radial "ox"
      setr bl:notify "ox"
      setr bl:textui "ox"
      setr game_enableDynamicDoorCreation "true"

      # --- OX Inventory ---
      setr inventory:framework "esx"
      setr inventory:slots 50
      setr inventory:weight 85000
      setr inventory:target true
      setr inventory:police ["police", "bcso", "sasp"]
      setr inventory:imagepath "nui://ox_inventory/web/images"
      setr inventory:autoreload false
      setr inventory:screenblur false
      setr inventory:keys ["TAB", "K", "F1"]
      setr inventory:enablekeys [249]
      setr inventory:aimedfiring false
      setr inventory:giveplayerlist true
      setr inventory:weaponanims true
      setr inventory:itemnotify true
      setr inventory:weaponnotify true
      setr inventory:dropprops true
      setr inventory:dropmodel "prop_med_bag_01b"
      setr inventory:weaponmismatch true
      setr inventory:ignoreweapons []
      setr inventory:suppresspickups 1
      set inventory:versioncheck true
      set inventory:clearstashes "6 MONTH"
      set inventory:webhook ""
      set inventory:loglevel 1
      set inventory:randomprices true
      set inventory:randomloot true
      set inventory:evidencegrade 2
      set inventory:trimplate true
      set inventory:accounts ["money"]
      set inventory:vehicleloot [
      ["cola", 1, 1],
      ["water", 1, 1],
      ["garbage", 1, 2, 50],
      ["panties", 1, 1, 5],
      ["money", 1, 50],
      ["money", 200, 400, 5],
      ["bandage", 1, 1]
      ]
      set inventory:dumpsterloot [
      ["aluminum", 1, 5],
      ["metalscrap", 1, 5],
      ["iron", 1, 5],
      ["steel", 1, 5],
      ["glass", 1, 5],
      ["rubber", 1, 5],
      ["plastic", 1, 5]
      ]

      # --- Voice (pma-voice) ---
      setr voice_enableRadioAnim 1
      setr voice_useNativeAudio true
      setr voice_useSendingRangeOnly false
      set mumble_allowExternalConnections true

      # --- Security ---
      sv_enableNetworkedSounds false
      sv_enableNetworkedScriptEntityStates false
      sv_enableNetworkedPhoneExplosions false
      sv_filterRequestControl 2

      # --- Chat ---
      set chat_showJoins false
      set chat_showQuits false
      set chat_showErrors false

      # --- Misc ---
      setr sv_showBusySpinnerOnLoadingScreen true
      set resources_useSystemChat true

      # --- ESX ---
      setr esx:locale "en"

  - action: write_file
    file: ./cfg/permissions.cfg
    contents: |
      #   ██╗  ██╗██╗██╗    ██╗██╗    ███████╗███████╗██╗  ██╗
      #   ██║ ██╔╝██║██║    ██║██║    ██╔════╝██╔════╝╚██╗██╔╝
      #   █████╔╝ ██║██║ █╗ ██║██║    █████╗  ███████╗ ╚███╔╝
      #   ██╔═██╗ ██║██║███╗██║██║    ██╔══╝  ╚════██║ ██╔██╗
      #   ██║  ██╗██║╚███╔███╔╝██║    ███████╗███████║██╔╝ ██╗
      #   ╚═╝  ╚═╝╚═╝ ╚══╝╚══╝ ╚═╝   ╚══════╝╚══════╝╚═╝  ╚═╝

      # --- Base Groups ---
      add_principal group.admin group.user
      add_principal group.admin group.mod
      add_principal group.mod group.support

      # --- Admin Permissions ---
      add_ace group.admin command allow
      add_ace group.admin command.quit deny
      add_ace group.admin admin allow
      add_ace group.admin esx.* allow
      add_ace group.admin ox.* allow

      # --- Moderator Permissions ---
      add_ace group.mod command.kick allow
      add_ace group.mod command.freeze allow
      add_ace group.mod command.bring allow
      add_ace group.mod command.warn allow
      add_ace group.mod command.* deny

      # --- Support Permissions ---
      add_ace group.support command.report allow
      add_ace group.support command.help allow
      add_ace group.support command.* deny

      # --- Resource Permissions ---
      add_ace resource.es_extended command.add_ace allow
      add_ace resource.es_extended command.add_principal allow
      add_ace resource.es_extended command.remove_principal allow
      add_ace resource.es_extended command.stop allow

      add_ace resource.ox_lib command.add_ace allow
      add_ace resource.ox_lib command.remove_ace allow
      add_ace resource.ox_lib command.add_principal allow
      add_ace resource.ox_lib command.remove_principal allow

      # --- Add your admins below ---
      # add_principal identifier.license2:XXXXXXXX group.admin # your name

  - action: write_file
    file: ./cfg/resources.cfg
    contents: |
      #   ██╗  ██╗██╗██╗    ██╗██╗    ███████╗███████╗██╗  ██╗
      #   ██║ ██╔╝██║██║    ██║██║    ██╔════╝██╔════╝╚██╗██╔╝
      #   █████╔╝ ██║██║ █╗ ██║██║    █████╗  ███████╗ ╚███╔╝
      #   ██╔═██╗ ██║██║███╗██║██║    ██╔══╝  ╚════██║ ██╔██╗
      #   ██║  ██╗██║╚███╔███╔╝██║    ███████╗███████║██╔╝ ██╗
      #   ╚═╝  ╚═╝╚═╝ ╚══╝╚══╝ ╚═╝   ╚══════╝╚══════╝╚═╝  ╚═╝

      # --- Core Dependencies ---
      ensure oxmysql
      ensure ox_lib
      ensure chat
      ensure hardcap
      ensure pma-voice

      # --- Base ---
      ensure cron
      ensure es_extended

      # --- OX Suite ---
      ensure ox_target
      ensure ox_inventory
      ensure ox_fuel
      ensure ox_doorlock

      # --- Appearance ---
      ensure illenium-appearance
      setr illenium-appearance:locale "en"

      # --- Standalone Essentials ---
      ensure bob74_ipl
      ensure Renewed-Weathersync
      ensure screencapture

      # --- Your Scripts (add below) ---
      # ensure [standalone]
      # ensure [scripts]

  # ============================
  # CLEANUP
  # ============================
  - action: remove_path
    path: ./tmp
