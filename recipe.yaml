$engine: 3
$onesync: on

name: Kiwi ESX
version: "1.0"
author: kiwidegen
description: >
  Modern ESX base with the full ox ecosystem.
  Includes ox_lib, ox_inventory, ox_target, ox_fuel, ox_doorlock,
  illenium-appearance, bob74_ipl, pma-voice, Renewed-Weathersync and screencapture.
  Bring your own multichar - any resource that fires esx:onPlayerJoined will work.

tasks:

  # ============================
  # CFX DEFAULT RESOURCES
  # ============================
  - action: download_github
    src: https://github.com/citizenfx/cfx-server-data
    ref: master
    subpath: resources
    dest: ./resources/[cfx-default]
  # ============================
  # KIWI ESX BASE
  # ============================
  - action: download_github
    src: https://github.com/kiwidegen/kiwi-esx
    ref: main
    dest: ./tmp/kiwi-esx

  - action: move_path
    src: ./tmp/kiwi-esx/[base]
    dest: ./resources/[base]

  - action: move_path
    src: ./tmp/kiwi-esx/[standalone]
    dest: ./resources/[standalone]

  - action: move_path
    src: ./tmp/kiwi-esx/[scripts]
    dest: ./resources/[scripts]

  - action: move_path
    src: ./tmp/kiwi-esx/cfg/server.cfg
    dest: ./server.cfg

  - action: move_path
    src: ./tmp/kiwi-esx/cfg
    dest: ./cfg

  - action: replace_string
    file: ./cfg/private.cfg
    mode: all_vars

  # ============================
  # DATABASE
  # ============================
  - action: connect_database

  - action: query_database
    file: ./resources/[base]/es_extended/es_extended.sql

  # ============================
  # OX RESOURCES
  # ============================
  - action: download_file
    url: https://github.com/CommunityOx/oxmysql/releases/latest/download/oxmysql.zip
    path: ./tmp/oxmysql.zip
  - action: unzip
    src: ./tmp/oxmysql.zip
    dest: ./resources/[ox]/

  - action: download_file
    url: https://github.com/CommunityOx/ox_lib/releases/latest/download/ox_lib.zip
    path: ./tmp/ox_lib.zip
  - action: unzip
    src: ./tmp/ox_lib.zip
    dest: ./resources/[ox]/

  - action: download_file
    url: https://github.com/CommunityOx/ox_inventory/releases/latest/download/ox_inventory.zip
    path: ./tmp/ox_inventory.zip
  - action: unzip
    src: ./tmp/ox_inventory.zip
    dest: ./resources/[ox]/

  - action: download_file
    url: https://github.com/CommunityOx/ox_target/releases/latest/download/ox_target.zip
    path: ./tmp/ox_target.zip
  - action: unzip
    src: ./tmp/ox_target.zip
    dest: ./resources/[ox]/

  - action: download_file
    url: https://github.com/CommunityOx/ox_fuel/releases/latest/download/ox_fuel.zip
    path: ./tmp/ox_fuel.zip
  - action: unzip
    src: ./tmp/ox_fuel.zip
    dest: ./resources/[ox]/

  - action: download_file
    url: https://github.com/CommunityOx/ox_doorlock/releases/latest/download/ox_doorlock.zip
    path: ./tmp/ox_doorlock.zip
  - action: unzip
    src: ./tmp/ox_doorlock.zip
    dest: ./resources/[ox]/
  - action: query_database
    file: ./resources/[ox]/ox_doorlock/sql/ox_doorlock.sql

  - action: waste_time
    seconds: 5

  # ============================
  # STANDALONE / MISC
  # ============================
  - action: download_github
    src: https://github.com/Bob74/bob74_ipl
    ref: master
    dest: ./resources/[standalone]/[misc]/bob74_ipl

  - action: download_github
    src: https://github.com/AvarianKnight/pma-voice
    ref: main
    dest: ./resources/[standalone]/[misc]/pma-voice

  - action: download_file
    url: https://github.com/iLLeniumStudios/illenium-appearance/releases/latest/download/illenium-appearance.zip
    path: ./tmp/illenium-appearance.zip
  - action: unzip
    src: ./tmp/illenium-appearance.zip
    dest: ./resources/[standalone]/[misc]/
  - action: query_database
    file: ./resources/[standalone]/[misc]/illenium-appearance/sql/player_outfits.sql
  - action: query_database
    file: ./resources/[standalone]/[misc]/illenium-appearance/sql/player_outfit_codes.sql
  - action: query_database
    file: ./resources/[standalone]/[misc]/illenium-appearance/sql/management_outfits.sql
  - action: query_database
    file: ./resources/[standalone]/[misc]/illenium-appearance/sql/playerskins.sql

  - action: download_file
    url: https://github.com/Renewed-Scripts/Renewed-Weathersync/releases/latest/download/Renewed-Weathersync.zip
    path: ./tmp/Renewed-Weathersync.zip
  - action: unzip
    src: ./tmp/Renewed-Weathersync.zip
    dest: ./resources/[standalone]/[misc]/

  - action: download_file
    url: https://github.com/itschip/screencapture/releases/latest/download/screencapture.zip
    path: ./tmp/screencapture.zip
  - action: unzip
    src: ./tmp/screencapture.zip
    dest: ./resources/[standalone]/[misc]/

  # ============================
  # CLEANUP
  # ============================
  - action: remove_path
    path: ./tmp
